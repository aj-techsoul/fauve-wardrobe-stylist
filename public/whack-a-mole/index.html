<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Whack-a-Mole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --accent: #f59e0b;
            --hole-color: #1e293b;
            --hole-border: #334155;
            --mole-color: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            z-index: 10;
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .stats {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            background: rgba(30, 41, 59, 0.5);
            padding: 1rem 2rem;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stat-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 1px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            background: rgba(15, 23, 42, 0.8);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }

        .hole {
            width: 120px;
            height: 120px;
            background-color: var(--hole-color);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.8), 
                        0 2px 5px rgba(255,255,255,0.05);
            border: 4px solid var(--hole-border);
            cursor: pointer;
        }

        .mole {
            width: 80%;
            height: 80%;
            background: linear-gradient(135deg, #a78bfa, #8b5cf6);
            border-radius: 50% 50% 10% 10%;
            position: absolute;
            bottom: -100%;
            left: 10%;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -5px 15px rgba(139, 92, 246, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mole::before {
            content: '';
            width: 40px;
            height: 15px;
            background-color: rgba(0,0,0,0.2);
            border-radius: 20px;
            position: absolute;
            top: 20px;
        }

        .mole::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: #334155;
            border-radius: 50%;
            position: absolute;
            top: 35px;
        }

        .hole.up .mole {
            bottom: 5%;
        }
        
        .hole.whacked .mole {
            background: #ef4444;
            transition: all 0.1s;
            transform: scale(0.9);
            box-shadow: 0 0 20px #ef4444;
        }

        .controls {
            margin-top: 3rem;
        }

        .btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:disabled {
            background: #334155;
            box-shadow: none;
            cursor: not-allowed;
            color: #94a3b8;
        }
        
        .particles {
            position: absolute;
            pointer-events: none;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 20;
        }
        
        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: explode 0.6s forwards ease-out;
        }
        
        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay h2 {
            font-size: 4rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .final-score {
            font-size: 2rem;
            margin-bottom: 2rem;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Whack-a-Mole</h1>
        <div class="stats">
            <div class="stat-box">
                <span class="stat-label">Score</span>
                <span id="score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">Time</span>
                <span id="time">30</span>
            </div>
        </div>
    </div>

    <div class="grid" id="grid">
        <div class="hole" data-id="0"><div class="mole"></div></div>
        <div class="hole" data-id="1"><div class="mole"></div></div>
        <div class="hole" data-id="2"><div class="mole"></div></div>
        <div class="hole" data-id="3"><div class="mole"></div></div>
        <div class="hole" data-id="4"><div class="mole"></div></div>
        <div class="hole" data-id="5"><div class="mole"></div></div>
        <div class="hole" data-id="6"><div class="mole"></div></div>
        <div class="hole" data-id="7"><div class="mole"></div></div>
        <div class="hole" data-id="8"><div class="mole"></div></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="controls">
        <button class="btn" id="startBtn">Start Game</button>
    </div>

    <div class="overlay" id="gameOver">
        <h2>Time's Up!</h2>
        <div class="final-score">Final Score: <span id="finalScore">0</span></div>
        <button class="btn" id="restartBtn">Play Again</button>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.getElementById('score');
        const timeBoard = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverScreen = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');
        const particlesContainer = document.getElementById('particles');

        let lastHole;
        let timeUp = false;
        let score = 0;
        let gameTime = 30; // seconds
        let countdownTimer;

        // Random time for a mole to stay up
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        // Pick a random hole
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        // Make mole pop up
        function peep() {
            const time = randomTime(400, 1000);
            const hole = randomHole(holes);
            hole.classList.add('up');
            
            setTimeout(() => {
                hole.classList.remove('up');
                if (!timeUp) peep();
            }, time);
        }

        // Start the game
        function startGame() {
            scoreBoard.textContent = 0;
            timeBoard.textContent = gameTime;
            timeUp = false;
            score = 0;
            startBtn.disabled = true;
            gameOverScreen.classList.remove('active');
            
            peep();
            
            let timeLeft = gameTime;
            countdownTimer = setInterval(() => {
                timeLeft--;
                timeBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    endGame();
                }
            }, 1000);
        }

        // End the game
        function endGame() {
            timeUp = true;
            startBtn.disabled = false;
            finalScoreEl.textContent = score;
            setTimeout(() => {
                gameOverScreen.classList.add('active');
            }, 1000); // Wait for last moles to go down
        }

        // Create explosion particles
        function createParticles(x, y) {
            const rect = particlesContainer.getBoundingClientRect();
            
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random explosion direction
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 50 + 20;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                
                particle.style.left = `${x - rect.left}px`;
                particle.style.top = `${y - rect.top}px`;
                
                particlesContainer.appendChild(particle);
                
                // Remove particle after animation
                setTimeout(() => {
                    particle.remove();
                }, 600);
            }
        }

        // Whack a mole
        function whack(e) {
            if (!e.isTrusted) return; // Cheater check
            
            if (this.classList.contains('up')) {
                score++;
                this.classList.remove('up');
                this.classList.add('whacked');
                
                // Reset visual state
                setTimeout(() => {
                    this.classList.remove('whacked');
                }, 150);
                
                scoreBoard.textContent = score;
                
                // Add particles at click position
                createParticles(e.clientX, e.clientY);
                
                // Small scale animation on the score text
                scoreBoard.style.transform = 'scale(1.5)';
                scoreBoard.style.color = '#f59e0b';
                setTimeout(() => {
                    scoreBoard.style.transform = 'scale(1)';
                    scoreBoard.style.color = 'inherit';
                }, 150);
            }
        }

        // Event listeners
        holes.forEach(hole => hole.addEventListener('mousedown', whack));
        holes.forEach(hole => hole.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevent double firing on touch
            whack.call(hole, e.touches[0]);
        }));
        
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

    </script>
</body>
</html>
